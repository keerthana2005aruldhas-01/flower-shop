
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floral Elegance - Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f1eb;
      font-family: Arial, sans-serif;
    }
    .login {
      background: white;
      padding: 35px;
      width: min(90%, 380px);
      border-radius: 15px;
      box-shadow: 0 8px 30px #0001;
    }
    h2 { color: #536b50; text-align: center; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      border: 1px solid #ccc;
    }
    button {
      background: #536b50;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #message { text-align: center; color: #b42318; }
  </style>
</head>
<body>
  <div class="login">
    <h2>Floral Elegance</h2>
    <h3>Admin Login</h3>

    <form id="loginForm">
      <input id="username" placeholder="Username" required>
      <input id="password" type="password"
             placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "admin" && password === "admin123") {
  window.location.href = "../index.html?admin=1";
} else {
  document.getElementById("message").textContent =
    "Invalid username or password.";
}
      
    });
  </script>
</body>
</html>
